<table>
    <thead>
        <tr>
            <th>Nom</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for task in tasks %}
            <tr>
                <td>{{ task.task_name }}</td>
                <td>{{ task.status }}</td>
                <td>
                    <button onclick="toggleTask( {{ task.id }})">Toggle</button>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
