<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <title>Birthdays</title>
    </head>
    <body>
        <div class="header">
            <h1>Birthdays</h1>
        </div>
        <div class="container">
            <div class="section">

                <h2>Add a Birthday</h2>
                <!-- TODO: Create a form for users to submit a name, a month, and a day -->
                 <form id="birthday-form" action="/birthday/create" method="post">
                    <input name="name" placeholder="Name" type="text" required>
                    <input name="month" placeholder="Month" type="number" min="1" max="12" required>
                    <input name="day" placeholder="Day" type="number" min="1" max="31" required>
                    <input type="submit" value="Add Birthday">
                </form>
            </div>

            <div class="section">

                <h2>All Birthdays</h2>
                <table>
                    <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Anniversaire</th>
                        <th>Actions</th>
                    </tr>
                    </thead>  
                    <tbody id="birthdays-tbody">
                        <!-- Lignes générées par JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </body>
    <script>
        async function refreshTable() {
            const response = await fetch('/birthdays');
            const birthdays = await response.json();
            const tbody = document.getElementById('birthdays-tbody');
            const rows = birthdays.map(function (birthday) {
            return `
            <tr>
            <td>${birthday.name}</td>
            <td>${birthday.month}/${birthday.day}</td>
            <td>
            <button onclick="editBirthday(${birthday.id}, '${birthday.name}',
            ${birthday.month}, ${birthday.day})">Modifier</button>
            <button onclick="deleteBirthday(${birthday.id})">Supprimer</button>
            </td>
            </tr>
            `;
            });
            tbody.innerHTML = rows.join('\n');
            
        }
        const form = document.getElementById('birthday-form');
        form.addEventListener('submit', async function (event) {
        event.preventDefault(); // Empêche le rechargement de la page
        const formData = new FormData(form);
        await fetch('/birthday/create', {
            method: 'POST',
            body: formData
            });
        await refreshTable();
        form.reset();
        });

        async function deleteBirthday(id) {
        if (!confirm('Supprimer cet anniversaire ?')) {
        return;
        }
        await fetch(`/birthday/delete/${id}`, { method: 'DELETE' });
        await refreshTable();
        }

        async function editBirthday(id, currentName, currentMonth, currentDay) {
            const name = prompt('Nom :', currentName);
            if (name === null) return;
            const month = prompt('Mois :', currentMonth);
            if (month === null) return;
            const day = prompt('Jour :', currentDay);
            if (day === null) return;
            const formData = new FormData();
            formData.append('name', name);
            formData.append('month', month);
            formData.append('day', day);
            await fetch(`/birthday/update/${id}`, {
            method: 'PUT',
            body: formData
            });
            await refreshTable();
        }
        // Chargement initial de la table
        refreshTable();
    </script>
</html>
