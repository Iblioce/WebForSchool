<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Search</title>
    </head>
    <body>
        <div id="basic_link">
            <a href="index.html"> google search</a>
        </div>
        <h1>Recherche avancée</h1>
        <form action="https://www.google.com/search">
            <table>
                <tbody>
                    <tr> 
                        <td>Tous ces mots :</td>
                        <td><input name="as_q" type="text" ></td>
                    </tr>
                    <tr>
                        <td>Ce mot ou cette expression exacts :</td>
                        <td><input name="as_epq" type="text" ></td>
                    </tr>
                    <tr>
                        <td>Aucun de mots suivants :</td>
                        <td><input name="as_eq" type="text"  td>
                    </tr>
                    <tr>
                        <td>Site ou domaine :</td>
                        <td><input name="as_sitesearch" type="text"></td>
                    </tr>
                    </tbody>
            </table>
            <br><input type="submit" value="advanced Search" id="Google Search Advanced">
            
            
        </form>
    </body>
</html>
